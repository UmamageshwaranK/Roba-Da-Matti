<title>Roba Da Matti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: slim header, one toolbar row, page strip on the left, sheet on a dark-ish desk in the middle. */
:root{
  --bg:#e8ecf0; --panel:#f8fafb; --panel2:#edf1f4; --ink:#17212b; --mute:#566472; --line:#d1d9e0;
  --accent:#0d7566; --accent-ink:#ffffff; --stage:#c9d1d9; --danger:#b3261e;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --panel:#1a2128; --panel2:#232c35; --ink:#e6ecf1; --mute:#93a1af; --line:#2f3a45;
    --accent:#3dc2aa; --accent-ink:#04211b; --stage:#0c1014; --danger:#ff8a80; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --panel:#1a2128; --panel2:#232c35; --ink:#e6ecf1; --mute:#93a1af; --line:#2f3a45;
  --accent:#3dc2aa; --accent-ink:#04211b; --stage:#0c1014; --danger:#ff8a80; color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%; margin:0; display:flex; flex-direction:column; background:var(--bg); color:var(--ink);
  font:14px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
}
button,input,select{font:inherit;color:inherit}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:12px}
.brand{font:700 20px/1 var(--f-display);letter-spacing:-.01em;margin-right:4px}
.doc{font:12px var(--f-mono);color:var(--mute);min-width:0;flex:1 1 180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 11px;cursor:pointer;line-height:1.2}
.btn:hover:not(:disabled){background:var(--panel2)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover:not(:disabled){filter:brightness(1.07);background:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:8px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.tool{border:1px solid transparent;background:transparent;border-radius:6px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.tool kbd{font:10px var(--f-mono);color:var(--mute)}
.tool:hover{background:var(--panel2)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.tool[aria-pressed="true"] kbd{color:inherit;opacity:.75}
.props{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:12px;color:var(--mute)}
.props label{display:flex;align-items:center;gap:6px}
.props input[type=color]{width:30px;height:28px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--panel)}
.props input[type=number],.props select{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:4px 6px;color:var(--ink)}
.props input[type=number]{width:62px}
.props :disabled{opacity:.4}
.main{flex:1;min-height:0;display:flex;gap:10px;margin-block:10px}
#strip{width:128px;flex:none;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.pg{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px;display:flex;flex-direction:column;gap:5px;cursor:pointer}
.pg[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pg canvas{width:100%;height:auto;display:block;background:#fff;border-radius:3px}
.pg .row{display:flex;justify-content:space-between;align-items:center;font:11px var(--f-mono);color:var(--mute)}
.pg .mini{display:flex;gap:2px}
.pg .mini button{border:0;background:transparent;border-radius:4px;padding:2px 5px;cursor:pointer;color:var(--mute)}
.pg .mini button:hover:not(:disabled){background:var(--panel2);color:var(--ink)}
.pg .mini button:disabled{opacity:.3;cursor:default}
#stage{flex:1;min-width:0;overflow:auto;background:var(--stage);border-radius:8px;padding:24px 20px}
#stage.drop{outline:3px dashed var(--accent);outline-offset:-8px}
#sheet{position:relative;width:max-content;margin:0 auto;box-shadow:0 2px 3px rgba(0,0,0,.18),0 12px 32px rgba(0,0,0,.22)}
#cv{display:block;background:#fff;touch-action:none;max-width:none}
#cv.t-select{cursor:default}
#cv.t-draw{cursor:crosshair}
#cv.t-text{cursor:text}
.editor{position:absolute;margin:0;padding:0;border:1px dashed #0d7566;background:rgba(255,255,255,.55);outline:none;resize:none;overflow:hidden;white-space:pre;line-height:1.2;z-index:3}
.zoom{margin-left:auto}
.zoom span{font:12px var(--f-mono);min-width:44px;text-align:center;color:var(--mute)}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:13px;max-width:min(92vw,520px);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#toast.show{opacity:1}
@media (max-width:760px){
  .main{flex-direction:column}
  #strip{width:auto;flex-direction:row;overflow-x:auto;overflow-y:hidden;padding-bottom:6px}
  .pg{width:92px;flex:none}
  .zoom{margin-left:0}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

<header class="top">
  <div class="brand">Proofdesk</div>
  <div class="doc" id="doc">Sample invoice</div>
  <div class="grp">
    <button class="btn" id="bOpen" title="Open a PDF or image, replacing what is here">Open file</button>
    <button class="btn" id="bAdd" title="Add pages from another PDF or image">Add pages</button>
    <button class="btn" id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button class="btn" id="bRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
    <button class="btn" id="bReset" title="Remove every edit on this page and go back to the original">Reset page</button>
    <button class="btn" id="bPng" title="Save this page as an image">Page as PNG</button>
    <button class="btn" id="bTxt" title="Read the text and save it as a plain text file">Save text</button>
    <button class="btn" id="bPdf">Save PDF</button>
    <button class="btn primary" id="bDocx" title="Read the scan and build an editable Word file with the same fonts, sizes, colors and table columns">Save as Word</button>
  </div>
</header>

<div class="tools" role="toolbar" aria-label="Editing tools">
  <div class="seg" id="toolSeg"></div>
  <div class="props">
    <label>Color <input type="color" id="pColor" value="#111111"></label>
    <label>Size <input type="number" id="pSize" min="1" max="200" value="18"></label>
    <label>Font <select id="pFont"><option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option></select></label>
    <label><input type="checkbox" id="pBold"> Bold</label>
    <label><input type="checkbox" id="pItalic"> Italic</label>
    <label title="New text copies the font, size and color of the nearest text on the page"><input type="checkbox" id="pAuto" checked> Match nearby text</label>
  </div>
  <div class="props scan">
    <label>Scan language <select id="ocrLang"><option value="eng">English</option><option value="tam">Tamil</option><option value="hin">Hindi</option><option value="tel">Telugu</option><option value="kan">Kannada</option><option value="mal">Malayalam</option><option value="eng+tam">English + Tamil</option><option value="eng+hin">English + Hindi</option><option value="eng+tel">English + Telugu</option><option value="eng+kan">English + Kannada</option><option value="eng+mal">English + Malayalam</option></select></label>
    <button class="btn" id="bOcr" title="Find the scanned text on this page. The page looks the same; click a green line to edit it">Find text on page</button>
    <button class="btn" id="bOcrAll" title="Find the scanned text on every page">All pages</button>
  </div>
  <div class="grp zoom">
    <button class="btn" id="zOut" aria-label="Zoom out">−</button>
    <span id="zLabel">100%</span>
    <button class="btn" id="zIn" aria-label="Zoom in">+</button>
    <button class="btn" id="zFit">Fit width</button>
  </div>
</div>

<div class="main">
  <aside id="strip" aria-label="Pages"></aside>
  <main id="stage"><div id="sheet"><canvas id="cv" class="t-select"></canvas></div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileOpen" accept="application/pdf,image/*" hidden>
<input type="file" id="fileAdd" accept="application/pdf,image/*" multiple hidden>
<input type="file" id="fileImg" accept="image/*" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var cv=$('#cv'), ctx=cv.getContext('2d'), stage=$('#stage'), sheet=$('#sheet'), strip=$('#strip');
var FONTS={sans:'Helvetica, Arial, sans-serif',serif:'Georgia, "Times New Roman", serif',mono:'"Courier New", Courier, monospace'};
var CANDS={sans:['Arial','Helvetica','Calibri','Verdana','Tahoma','Trebuchet MS','Segoe UI','Helvetica Neue','Roboto','Open Sans','Lato'],
  serif:['Times New Roman','Georgia','Cambria','Palatino Linotype','Book Antiqua','Garamond','Constantia','Times','Baskerville'],
  mono:['Courier New','Consolas','Lucida Console','Menlo','Monaco','Courier']};
var GENSTACK={sans:'sans-serif',serif:'serif',mono:'monospace'},INST={sans:[],serif:[],mono:[]},CLS={sans:'sans',serif:'serif',mono:'mono'};
/* Find which well-known fonts this device really has, so a scan can be matched to a specific one. */
function initFonts(){
  try{
    var c=document.createElement('canvas').getContext('2d'),t='mmmmmmmmmmlliWWWW 0123456789',base={},gs=['monospace','serif','sans-serif'];
    gs.forEach(function(g){c.font='72px '+g;base[g]=c.measureText(t).width});
    Object.keys(CANDS).forEach(function(cls){CANDS[cls].forEach(function(nm){
      var hit=false;gs.forEach(function(g){c.font='72px "'+nm+'", '+g;if(Math.abs(c.measureText(t).width-base[g])>0.5)hit=true});
      if(hit){FONTS[nm]='"'+nm+'", '+GENSTACK[cls];CLS[nm]=cls;INST[cls].push(nm)}
    })});
  }catch(e){}
}
initFonts();
var LH=1.2;
var pages=[], all=new Map(), cur=0, tool='select', zoom=1, fitMode=true, sel=null, drag=null, preview=null, hidden=null, editing=null, busy=false, docName='sample-invoice';
var imgStore=new Map(), idc=0, thumbs=new Map();
var hist=[], hi=-1;
var dl=null;
var TOOLS=[
  {id:'select',label:'Select',key:'v',tip:'Click to select, drag to move, double-click text to edit'},
  {id:'retext',label:'Edit text',key:'e',tip:'Click a line of text to change its words in the same font, size and color. Or drag a box over it.'},
  {id:'text',label:'Add text',key:'t',tip:'Click on the page and type'},
  {id:'white',label:'Whiteout',key:'w',tip:'Drag to cover something with the page background colour'},
  {id:'block',label:'Block',key:'b',tip:'Drag to cover with a solid colour'},
  {id:'hl',label:'Highlight',key:'h',tip:'Drag over text to highlight it'},
  {id:'box',label:'Box',key:'x',tip:'Drag to draw an outlined box'},
  {id:'pen',label:'Pen',key:'p',tip:'Draw freehand'},
  {id:'img',label:'Image',key:'i',tip:'Place a picture or signature image on the page'}
];
var tc={text:'#111111',retext:'#111111',hl:'#ffe14d',box:'#d92d20',block:'#111111',pen:'#1a56db',white:'#ffffff',img:'#111111',select:'#111111'};
var sz={text:18,retext:18,pen:2,box:2};
var fontDef='sans', boldDef=false, italicDef=false;

/* ---------- helpers ---------- */
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},3200)}
function mk(w,h){var c=document.createElement('canvas');c.width=w;c.height=h;return c}
function newPage(base,scale){var p={id:'p'+(++idc),base:base,w:base.width,h:base.height,scale:scale,objects:[]};all.set(p.id,p);return p}
function page(){return pages[cur]}
function setBusy(b){busy=b;['bOpen','bAdd','bPdf','bPng','bOcr','bOcrAll','bDocx','bTxt'].forEach(function(id){$('#'+id).disabled=b})}
function label(){var n=pages.length;$('#doc').textContent=docName+' · '+n+(n===1?' page':' pages');}

/* ---------- sample page ---------- */
function makeSample(){
  var c=mk(1190,1684),x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,1190,1684);
  x.fillStyle='#16324f';x.fillRect(0,0,1190,16);
  x.textBaseline='top';
  x.fillStyle='#16324f';x.font='700 56px Georgia, serif';x.fillText('Kaveri Print Works',90,92);
  x.fillStyle='#4a5a6a';x.font='26px Helvetica, Arial, sans-serif';
  x.fillText('48 Temple Road, Trichy 620002',90,168);x.fillText('GSTIN 33AAACK1234F1Z5',90,204);
  x.textAlign='right';x.fillStyle='#16324f';x.font='700 46px Helvetica, Arial, sans-serif';x.fillText('INVOICE',1100,96);
  x.fillStyle='#222';x.font='26px Helvetica, Arial, sans-serif';
  x.fillText('No. 2041',1100,160);x.fillText('Date: 12 October 2026',1100,198);x.fillText('Due: 26 October 2026',1100,236);
  x.textAlign='left';
  x.fillStyle='#4a5a6a';x.font='600 22px Helvetica, Arial, sans-serif';x.fillText('BILL TO',90,320);
  x.fillStyle='#111';x.font='30px Helvetica, Arial, sans-serif';
  x.fillText('Meenakshi Traders',90,356);x.fillText('22 Bazaar Road',90,398);x.fillText('Coimbatore 641001',90,440);
  var top=540;
  x.fillStyle='#16324f';x.fillRect(90,top,1010,56);
  x.fillStyle='#fff';x.font='600 24px Helvetica, Arial, sans-serif';
  x.fillText('Description',110,top+15);x.textAlign='right';x.fillText('Qty',700,top+15);x.fillText('Rate',880,top+15);x.fillText('Amount',1080,top+15);
  var rows=[['A4 flyers, 130 gsm, two sides','500','₹6.40','₹3,200'],['Business cards, matte laminate','1000','₹1.45','₹1,450'],['Flex banner, 4 x 6 ft','1','₹2,800','₹2,800']];
  rows.forEach(function(r,i){
    var y=top+56+i*64;
    if(i%2===0){x.fillStyle='#f1f4f7';x.fillRect(90,y,1010,64)}
    x.fillStyle='#111';x.font='27px Helvetica, Arial, sans-serif';x.textAlign='left';x.fillText(r[0],110,y+18);
    x.textAlign='right';x.fillText(r[1],700,y+18);x.fillText(r[2],880,y+18);x.fillText(r[3],1080,y+18);
  });
  var ty=top+56+rows.length*64+40;
  x.strokeStyle='#c9d1d9';x.lineWidth=2;x.beginPath();x.moveTo(700,ty-14);x.lineTo(1100,ty-14);x.stroke();
  x.font='27px Helvetica, Arial, sans-serif';x.fillStyle='#333';
  x.textAlign='left';x.fillText('Subtotal',720,ty);x.fillText('GST 18%',720,ty+48);
  x.textAlign='right';x.fillText('₹7,450',1080,ty);x.fillText('₹1,341',1080,ty+48);
  x.fillStyle='#16324f';x.font='700 34px Helvetica, Arial, sans-serif';x.textAlign='left';x.fillText('Total',720,ty+112);x.textAlign='right';x.fillText('₹8,791',1080,ty+112);
  x.textAlign='left';x.fillStyle='#4a5a6a';x.font='24px Helvetica, Arial, sans-serif';
  x.fillText('Payment by bank transfer within 14 days. Thank you for your order.',90,ty+230);
  x.fillStyle='#8a97a4';x.font='italic 22px Helvetica, Arial, sans-serif';
  x.fillText('Sample page. Use Open file to edit your own PDF or image.',90,1580);
  return newPage(c,2);
}

/* ---------- drawing ---------- */
function setFont(c,o){c.font=(o.italic?'italic ':'')+(o.bold?'700 ':'400 ')+o.size+'px '+FONTS[o.font||'sans']}
var mctx=document.createElement('canvas').getContext('2d');
function fm(o){mctx.font=(o.italic?'italic ':'')+(o.bold?'700 ':'400 ')+o.size+'px '+FONTS[o.font||'sans'];var m=mctx.measureText('Hg'),a=m.fontBoundingBoxAscent,d=m.fontBoundingBoxDescent;if(!(a>0)){a=o.size*0.9;d=o.size*0.22}return {a:a,d:d}}
function baseOff(o){var f=fm(o);return (LH*o.size-(f.a+f.d))/2+f.a}
function yForBase(o,by){return by-baseOff(o)}
function lines(o){return String(o.text||'').split('\n')}
function bb(o){
  if(o.t==='rect'||o.t==='img'||o.t==='ocrline')return {x:o.x,y:o.y,w:o.w,h:o.h};
  if(o.t==='pen'){var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;o.pts.forEach(function(p){x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1])});return {x:x0,y:y0,w:x1-x0,h:y1-y0}}
  setFont(ctx,o);var w=0;lines(o).forEach(function(l){w=Math.max(w,ctx.measureText(l).width)});
  return {x:o.x,y:o.y,w:Math.max(w,o.size*0.6),h:lines(o).length*o.size*LH};
}
function drawObj(c,o){
  if(o.t==='ocrline')return;
  c.save();
  if(o.t==='text'){
    setFont(c,o);c.fillStyle=o.color;c.textBaseline='alphabetic';var b0=o.y+baseOff(o);
    lines(o).forEach(function(l,i){c.fillText(l,o.x,b0+i*o.size*LH)});
  }else if(o.t==='rect'){
    if(o.kind==='hl'){c.globalCompositeOperation='multiply';c.fillStyle=o.color;c.fillRect(o.x,o.y,o.w,o.h)}
    else if(o.kind==='box'){c.strokeStyle=o.color;c.lineWidth=o.lw;c.strokeRect(o.x,o.y,o.w,o.h)}
    else{c.fillStyle=o.color;c.fillRect(o.x,o.y,o.w,o.h)}
  }else if(o.t==='pen'){
    c.strokeStyle=o.color;c.lineWidth=o.lw;c.lineCap='round';c.lineJoin='round';c.beginPath();
    o.pts.forEach(function(p,i){if(i===0)c.moveTo(p[0],p[1]);else c.lineTo(p[0],p[1])});
    if(o.pts.length===1)c.lineTo(o.pts[0][0]+.01,o.pts[0][1]);
    c.stroke();
  }else if(o.t==='img'){
    var im=imgStore.get(o.imgId);if(im)c.drawImage(im,o.x,o.y,o.w,o.h);
  }

}
function paint(c,p,ui){
  c.clearRect(0,0,p.w,p.h);c.drawImage(p.base,0,0);
  p.objects.forEach(function(o){if(o!==hidden)drawObj(c,o)});
  if(!ui)return;
  var k=cv.clientWidth/cv.width||1, acc=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()||'#0d7566';
  var hasLines=false;p.objects.forEach(function(o){if(o.t==='ocrline'){if(!hasLines){c.save();c.fillStyle='rgba(13,117,102,.10)';c.strokeStyle='rgba(13,117,102,.55)';c.lineWidth=1.5/k;hasLines=true}c.fillRect(o.x,o.y,o.w,o.h);c.strokeRect(o.x,o.y,o.w,o.h)}});if(hasLines)c.restore();
  if(preview){
    c.save();var r=norm(preview);
    if(preview.kind==='hl'||preview.kind==='block'||preview.kind==='box'){drawObj(c,{t:'rect',kind:preview.kind,color:preview.color,lw:preview.lw,x:r.x,y:r.y,w:r.w,h:r.h})}
    else{c.fillStyle='rgba(13,117,102,.18)';c.fillRect(r.x,r.y,r.w,r.h)}
    c.strokeStyle=acc;c.lineWidth=2/k;c.setLineDash([8/k,6/k]);c.strokeRect(r.x,r.y,r.w,r.h);c.restore();
  }
  if(sel&&sel!==hidden&&p.objects.indexOf(sel)>-1){
    var b=bb(sel),pad=4/k;c.save();c.strokeStyle=acc;c.lineWidth=2/k;c.setLineDash([8/k,5/k]);c.strokeRect(b.x-pad,b.y-pad,b.w+2*pad,b.h+2*pad);
    if(canResize(sel)){c.setLineDash([]);c.fillStyle=acc;var hs=12/k;c.fillRect(b.x+b.w-hs/2+pad,b.y+b.h-hs/2+pad,hs,hs)}
    c.restore();
  }
}
function redraw(){var p=page();if(p)paint(ctx,p,true)}
function norm(d){return {x:Math.min(d.x0,d.x1),y:Math.min(d.y0,d.y1),w:Math.abs(d.x1-d.x0),h:Math.abs(d.y1-d.y0)}}
function canResize(o){return o.t==='rect'||o.t==='img'}

/* ---------- history ---------- */
function snap(){var objs={};pages.forEach(function(p){objs[p.id]=p.objects});return JSON.stringify({order:pages.map(function(p){return p.id}),objs:objs,cur:cur})}
function resetHistory(){hist=[snap()];hi=0;updUndo()}
function commit(){hist.length=hi+1;hist.push(snap());if(hist.length>120)hist.shift();hi=hist.length-1;updUndo();refreshThumb(page())}
function restore(s){

async function pdfPages(file){

  var S=pdf.numPages>25?1.5:2,out=[];
  for(var i=1;i<=pdf.numPages;i++){
    $('#doc').textContent='Reading page '+i+' of '+pdf.numPages+'…';
    var pg=await pdf.getPage(i),vp=pg.getViewport({scale:S}),c=mk(Math.ceil(vp.width),Math.ceil(vp.height)),x=c.getContext('2d',{willReadFrequently:true});

    await pg.render({canvasContext:x,viewport:vp}).promise;var np=newPage(c,S);np.src={buf:src,i:i-1};out.push(np);

}

  var c=mk(Math.round(bmp.width*k),Math.round(bmp.height*k)),x=c.getContext('2d',{willReadFrequently:true});

async function loadFiles(files,replace){
  files=Array.prototype.filter.call(files,function(f){return f.type==='application/pdf'||/\.pdf$/i.test(f.name)||/^image\//.test(f.type)});
  if(!files.length){toast('Choose a PDF or an image file.');return}
  setBusy(true);var added=[];

      var f=files[i],isPdf=f.type==='application/pdf'||/\.pdf$/i.test(f.name);

      catch(err){
        var msg=/password/i.test(String(err&&(err.name||err.message)))?'“'+f.name+'” is password protected. Unlock it first.':'“'+f.name+'” could not be read.';
        toast(msg);

/* ---------- export ---------- */
function flat(p){var c=mk(p.w,p.h),x=c.getContext('2d');var h=hidden;hidden=null;paint(x,p,false);hidden=h;return c}
function toBlob(c,type,q){return new Promise(function(res){c.toBlob(res,type,q)})}
async function save(filename,data){
  if(!dl){toast('Saving is not available in this view. Open the page in claude.ai to save files.');return false}
  try{await dl.save({filename:filename,data:data});return true}
  catch(err){if(err&&err.code!=='declined')toast('Could not save: '+(err.message||'unknown error'));return false}
}
$('#bPdf').onclick=async function(){
  finishEditing();setBusy(true);
  try{
    var doc=await PDFLib.PDFDocument.create(),srcCache=new Map();
    for(var i=0;i<pages.length;i++){
      $('#doc').textContent='Saving page '+(i+1)+' of '+pages.length+'…';
      var p=pages[i];
      if(p.src&&!p.objects.some(function(o){return o.t!=='ocrline'})){
        try{
          var sd=srcCache.get(p.src.buf);if(!sd){sd=await PDFLib.PDFDocument.load(p.src.buf,{ignoreEncryption:true});srcCache.set(p.src.buf,sd)}
          var cp=await doc.copyPages(sd,[p.src.i]);doc.addPage(cp[0]);continue;
        }catch(e){}
      }
      var blob=await toBlob(flat(p),'image/jpeg',0.92),bytes=new Uint8Array(await blob.arrayBuffer());
      var im=await doc.embedJpg(bytes),w=p.w/p.scale,h=p.h/p.scale,pg=doc.addPage([w,h]);pg.drawImage(im,{x:0,y:0,width:w,height:h});
    }
    var out=await doc.save();label();
    if(await save(docName.replace(/[^\w\- ]+/g,'')+'-edited.pdf',out))toast('PDF saved.');
  }catch(err){toast('Could not build the PDF.')}
  finally{setBusy(false);label()}
};

};

/* ---------- keyboard ---------- */
document.addEventListener('keydown',function(e){
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  var mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return}
  if(mod||e.altKey)return;
  if((e.key==='Delete'||e.key==='Backspace')&&sel){
    e.preventDefault();var p=page();p.objects.splice(p.objects.indexOf(sel),1);sel=null;commit();syncProps();redraw();return;
  }
  if(e.key==='Escape'){sel=null;syncProps();redraw();return}
  if(e.key==='Enter'&&sel&&sel.t==='text'){e.preventDefault();editText(sel);return}
  if(sel&&/^Arrow/.test(e.key)){
    e.preventDefault();var s=e.shiftKey?12:2,dx=e.key==='ArrowLeft'?-s:e.key==='ArrowRight'?s:0,dy=e.key==='ArrowUp'?-s:e.key==='ArrowDown'?s:0;
    if(sel.t==='pen')sel.pts=sel.pts.map(function(q){return [q[0]+dx,q[1]+dy]});else{sel.x+=dx;sel.y+=dy}
    redraw();clearTimeout(keydown.h);keydown.h=setTimeout(commit,400);return;
  }
  var t=TOOLS.filter(function(t){return t.key===e.key.toLowerCase()})[0];if(t)setTool(t.id);
});
function keydown(){}
